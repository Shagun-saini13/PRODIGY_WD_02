<!DOCTYPE html>Add commentMore actions
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StopWatch</title>

    <!-- Link to external CSS -->
     <link rel="stylesheet" href="styles.css" />

</head>
<body>
    <div class="container">

        <!-- StopWatch title -->
        <div class="top-left-title">Stopwatch</div>

        <!-- Stopwatch Circle Display -->
        <div class="watch">
            <div class="outer-circle">
                <div class="inner-circle">
                    <!-- Time values displayed -->
                    <span class="text minute">0 :</span>
                    <span class="text sec">&nbsp;0 :</span>
                    <span class="text msec">&nbsp;0</span>
                </div>
            </div>
            <!-- Play, reset, lap button -->
            <div class="button-wrapper">
                <button class="button reset hidden">Reset</button>
                <button class="button play">Play</button>
                <button class="button lap hidden">Laps</button>
            </div>
        </div>

        <!-- Lap List and Clear Button -->
        <ul class="laps">
            <!-- clear All Button -->
            <button class="lap-clear-button hidden">Clear All</button>
        </ul>
    </div>


    <!-- JavaScript -->
    <script>
        const playButton = document.getElementsByClassName("play")[0];
        const lapButton = document.getElementsByClassName("lap")[0];
        const resetButton = document.getElementsByClassName("reset")[0];
        const clearButton = document.getElementsByClassName("lap-clear-button")[0];
        const second = document.getElementsByClassName("sec")[0];
        const minute = document.getElementsByClassName("minute")[0];
        const centiSecond = document.getElementsByClassName("msec")[0];
        const laps = document.getElementsByClassName("laps")[0];
        const bg = document.getElementsByClassName("outer-circle")[0];

        let isplay = false;
        let secCounter=0;
        let min;
        let sec;
        let centiSec;
        let centiCounter = 0;
        let minCounter = 0;
        let lapItem  = 0;
        let isReset = false;

        
        // Show Lap and Reset buttons
        const toggleButton = () => {
            lapButton.classList.remove("hidden");
            resetButton.classList.remove("hidden");
        }

        // Play or pause stopwatch
        const play = () => {
            if(!isplay && !isReset){
                playButton.innerHTML = 'Pause';
                bg.classList.add("animation-bg");
                // Minute Counter
                min = setInterval(() => {
                    minute.innerHTML = `${++minCounter} :`;
                }, 60*1000);
                // Seconds Counter
                sec = setInterval(() => {6
                    if(secCounter === 60){
                        secCounter = 0;
                    }
                    second.innerHTML = `&nbsp;${++secCounter} :`;
                }, 1000);
                // CentiSecond Counter
                centiSec = setInterval(() => {
                    if(centiCounter === 100){
                        centiCounter = 0; 
                    }
                    centiSecond.innerHTML = `&nbsp;${++centiCounter}`;
                }, 10);
                isplay = true;
                isReset = true;
            }
            else{
                playButton.innerHTML = 'Play';
                clearInterval(min);
                clearInterval(sec); 
                clearInterval(centiSec);    
                isplay = false;
                isReset = false;
                bg.classList.remove("animation-bg");
            }
            toggleButton();
        }

        const reset = () => {
            // Stop all intervals
            clearInterval(min);
            clearInterval(sec); 
            clearInterval(centiSec);    

            // Reset counters
            secCounter = 0;
            centiCounter = 0;
            minCounter = 0;

            // Update display
            second.innerHTML = '&nbsp;0 :';
            centiSecond.innerHTML = '&nbsp;0';
            minute.innerHTML = '0 :';

            // Reset state and UI
            isplay = false;
            isReset = false;
            playButton.innerHTML = 'Play';
            lapButton.classList.add("hidden");
            resetButton.classList.add("hidden");
            bg.classList.remove("animation-bg");
        }


        const lap = () => {
            const li = document.createElement("li");
            const number = document.createElement("span");
            const timeStamp = document.createElement("span");

            li.setAttribute("class", "lap-item");
            number.setAttribute("class", "number");
            timeStamp.setAttribute("class", "time-stamp");

            number.innerText = `#${++lapItem}`;
            timeStamp.innerHTML = `${minCounter} : ${secCounter} : ${centiCounter}`;

            li.append(number, timeStamp);
            laps.append(li);

            clearButton.classList.remove("hidden");
        }

        // Clear all laps
        const clearAll = () =>{
            laps.innerHTML = '';
            laps.append(clearButton);
            clearButton.classList.add("hidden");
            lapItem = 0;
        }
        playButton.addEventListener("click", play);
        resetButton.addEventListener("click", reset);
        lapButton.addEventListener("click", lap);
        clearButton.addEventListener("click", clearAll);

    </script>
</body>
</html>
