<!DOCTYPE html>Add commentMore actions
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StopWatch</title>

    <!-- External CSS -->
     <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="container">

        <div class="watch">
            <div class="outer-circle">
                <div class="inner-circle">
                    <span class="text minute"></span>
                    <span class="text sec"></span>
                    <span class="text msec"></span>
                </div>
            </div>
            <div class="button-wrapper">
                <button class="button reset hidden">Reset</button>
                <button class="button play">Play</button>
                <button class="button lap hidden">Laps</button>
            </div>
        </div>

        <ul class="laps">
            <li class="lap-items">
                <span class="number">#1</span>
                <span class="time-stamp"> 01 : 43 : 07</span>
            </li>
            <li class="lap-items">
                <span class="number">#1</span>
                <span class="time-stamp"> 01 : 43 : 07</span>
            </li>
            <li class="lap-items">
                <span class="number">#1</span>
                <span class="time-stamp"> 01 : 43 : 07</span>
            </li>
            <li class="lap-items">
                <span class="number">#1</span>
                <span class="time-stamp"> 01 : 43 : 07</span>
            </li>
            <li class="lap-items">
                <span class="number">#1</span>
                <span class="time-stamp"> 01 : 43 : 07</span>
            </li>
            <li class="lap-items">
                <span class="number">#1</span>
                <span class="time-stamp"> 01 : 43 : 07</span>
            </li>
            <li class="lap-items">
                <span class="number">#1</span>
                <span class="time-stamp"> 01 : 43 : 07</span>
            </li>
            <li class="lap-items">
                <span class="number">#1</span>
                <span class="time-stamp"> 01 : 43 : 07</span>
            </li>
            <button class="lap-clear-button">Clear All</button>
        </ul>
    </div>
    <script>
        const playButton = document.getElementsByClassName("play")[0];
        const lapButton = document.getElementsByClassName("lap")[0];
        const resetButton = document.getElementsByClassName("reset")[0];
        const second = document.getElementsByClassName("sec")[0];

        let isplay = false;
        let sec=0;

        const toggleButton = () => {
            lapButton.classList.remove("hidden");
            resetButton.classList.remove("hidden");
        }

        const play = () => {
            if(!isplay){
                playButton.innerHTML = 'Pause';
                isplay = true;
            }
            else{
                playButton.innerHTML = 'Play';
                isplay = false;
            }
            toggleButton();
        }

        // Play StopWatch count Seconds
        const playSec = () => {
            setInterval(() => {
                second.innerHTML = sec++;
            }, 1000);
        }
        const reset = () => {
            play();
            lapButton.classList.add("hidden");
            resetButton.classList.add("hidden");
        }

        playButton.addEventListener("click", play);
        resetButton.addEventListener("click", reset);
    </script>
</body>
</html>
